experiment: dual_swin_zernike_brats2020

paths:
  data_root: /root/autodl-tmp/archive
  split_json: ../data/splits/brats2020_reliability.json
  run_root: ../runs
  baseline_checkpoint: ../../baseline/runs/brats2020_200ep/model.pt

data:
  train_center: TCIA
  val_fraction: 0.2
  roi_size: [128, 128, 128]
  workers: 8
  debug_cases: 0
  flip_probability: 0.2
  scale_probability: 0.1
  shift_probability: 0.1
  spacing_tolerance: 0.05
  resample:
    enabled: false
    spacing: [1.0, 1.0, 1.0]

model:
  in_channels: 4
  region_channels: 3
  output_mode: independent_sigmoid
  feature_size: 48
  dropout_rate: 0.0
  attention_dropout_rate: 0.0
  dropout_path_rate: 0.0
  head_dropout_rates: [0.2, 0.3]
  use_checkpoint: true
  encoder_warm_start: true

zernike:
  windows: [3, 5, 7]
  orders: [[0, 0], [1, 1], [2, 0], [2, 2]]
  # Exact halo-preserving chunks; smaller depth lowers calibration peak VRAM.
  chunk_depth: 16
  stats_max_batches: 0

uncertainty:
  # Legacy checkpoint compatibility only; raw_eta is not used by geometric calibration.
  eta_init: 1.0
  xi_init: 1.0
  bias_init: -2.0
  # Retained for legacy metadata; Risk Brier is diagnostic during calibration.
  lambda_u: 1.0
  # Applied only after loading the calibration source checkpoint.
  calibration_fusion:
    enabled: true
    xi: 8.0
    bias: -4.8
  # Calibration-only excessive-gap penalty weighted by geometric uncertainty.
  margin_gradient:
    enabled: true
    weight: 0.02
    uncertainty_power: 1.0
    margin: 1.0

label_transfer:
  radius: 2
  sigma: 1.0
  gamma: 2.0
  alpha_max: 0.35
  beta: 0.75
  iterations: 4
  z0_quantile: 0.5

training:
  batch_size: 1
  warmup_epochs: 150
  calibration_epochs: 50
  # Preserve the existing warmup schedule while validating calibration every epoch.
  warmup_validation_every: 5
  validation_every: 1
  learning_rate: 0.0001
  calibration_learning_rate: 0.00001
  weight_decay: 0.00001
  scheduler_warmup_epochs: 20
  amp: true
  # Sliding-window validation concurrency only; does not change the objective.
  sw_batch_size: 1
  infer_overlap: 0.5
  dice_tolerance: 0.01
  # Margin calibration updates only the two decoder prediction heads.
  calibration_trainable_scope: heads
  # Legacy fallback when calibration_trainable_scope is omitted from an old config.
  freeze_segmentation_during_calibration: true

evaluation:
  splits: [val, test_CBICA, test_2013, test_TMC]
  workers: 0
  # Aggressive all-voxel refine: 0.35 * 2.84 = 0.994, kept below 1 for stability.
  refine_strength_scale: 2.84
  # Use the checkpoint-compatible 5x5x5 neighborhood and sharpen reliable votes.
  refine_neighborhood_radius: 2
  refine_neighborhood_sigma: 1.0
  refine_neighbor_reliability_power: 2.0
  refine_audit:
    enabled: true
    save_nifti: true
  max_metric_voxels: 200000
  calibration_bins: 15
  high_confidence_threshold: 0.95
  save_nifti: false
  release_cuda_cache: true

monitoring:
  enabled: true
  hash_baseline_checkpoint: true
  batch_interval: 0
  gradient_interval: 10
  uncertainty_map_every: 10
  uncertainty_map_dtype: float16
  uncertainty_map_components: true
  plateau_patience_validations: 10
  memory_multiplier_limit: 3.0

reproducibility:
  seed: 2026
  deterministic: true
